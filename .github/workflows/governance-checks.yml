name: Governance Checks

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"
      - "thara/**"
      - "ogx/**"
      - "oogx/**"
      - "ogx-prime/**"
      - "cores-os/**"
      - "minios/**"
      - "feature/**"
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  build:
    name: "🔨 Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check project structure
        run: |
          echo "✅ Repository structure validated"
          ls -la

  lint:
    name: "🧹 Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint check (YAML / JSON / Markdown)
        run: |
          echo "Validating YAML files..."
          find . -name "*.yml" -o -name "*.yaml" | grep -v "node_modules" | while read f; do
            python3 -c "import yaml, sys; yaml.safe_load(open('$f'))" 2>&1 && echo "  ✅ $f" || echo "  ❌ $f"
          done
          echo "Validating JSON files..."
          find . -name "*.json" | grep -v "node_modules" | while read f; do
            python3 -c "import json, sys; json.load(open('$f'))" 2>&1 && echo "  ✅ $f" || echo "  ❌ $f"
          done
          echo "✅ Lint completed"

  quality:
    name: "🏆 Quality Gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quality checks
        run: |
          echo "🔍 Checking governance files..."
          MISSING=0
          for f in \
            ".github/CODEOWNERS" \
            ".github/sentinel/decision-matrix.yml" \
            ".github/rulesets/critical-branches.json" \
            ".github/rulesets/feature-branches.json" \
            "docs/governance/branch-protection.md" \
            "docs/governance/rollout-phases.md"; do
            if [[ -f "$f" ]]; then
              echo "  ✅ $f"
            else
              echo "  ❌ $f MISSING"
              MISSING=$((MISSING+1))
            fi
          done
          if [[ $MISSING -gt 0 ]]; then
            echo "❌ $MISSING required governance file(s) missing"
            exit 1
          fi
          echo "✅ All required governance files present"

  secret-scan:
    name: "🔐 Secret Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        run: |
          echo "🔍 Scanning for accidental secrets..."
          # Basic patterns — augment with trufflehog/gitleaks in production
          FOUND=0
          PATTERNS=(
            "password\s*=\s*['\"][^'\"]{6,}"
            "secret\s*=\s*['\"][^'\"]{6,}"
            "api_key\s*=\s*['\"][^'\"]{6,}"
            "token\s*=\s*['\"][^'\"]{6,}"
            "-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----"
          )
          for pattern in "${PATTERNS[@]}"; do
            if grep -rEi "$pattern" --include="*.yml" --include="*.yaml" --include="*.json" --include="*.md" --include="*.js" --include="*.ts" . 2>/dev/null | grep -v ".git/"; then
              echo "⚠️  Potential secret pattern found: $pattern"
              FOUND=$((FOUND+1))
            fi
          done
          if [[ $FOUND -gt 0 ]]; then
            echo "❌ $FOUND potential secret pattern(s) detected — review before merging"
            exit 1
          fi
          echo "✅ No secrets detected"

  dependency-review:
    name: "📦 Dependency Review"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: high
